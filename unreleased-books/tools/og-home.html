<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>OG — Unreleased Books</title>
<link rel="stylesheet" href="../css/fonts.css">
<style>
  *{box-sizing:border-box}
  html,body{margin:0;width:1200px;height:630px;overflow:hidden;background:#08060a;color:#f2ecee;font-family:'Manrope',system-ui,sans-serif}
  .canvas{position:relative;width:1200px;height:630px;padding:64px 68px;display:grid;grid-template-columns:1fr 340px;gap:54px;align-items:center;background:
    radial-gradient(60% 90% at 8% 12%,rgba(125,16,48,.44),transparent 68%),
    radial-gradient(45% 70% at 96% 92%,rgba(201,164,92,.16),transparent 70%),
    linear-gradient(120deg,#120a11 0%,#0a0710 62%)}
  .canvas::after{content:"";position:absolute;inset:26px;border:1px solid rgba(201,164,92,.28);pointer-events:none}
  .label{display:flex;align-items:center;gap:12px;font-family:'IBM Plex Mono',monospace;font-size:13px;letter-spacing:.22em;text-transform:uppercase;color:#c9a45c;margin-bottom:26px}
  .label::before{content:"";width:34px;height:1px;background:#c9a45c}
  h1{font-family:'Bodoni Moda',Georgia,serif;font-weight:650;font-size:82px;line-height:.93;letter-spacing:-.03em;margin:0 0 24px;color:#fbf5ea;text-shadow:0 6px 40px rgba(0,0,0,.55)}
  h1 em{font-style:italic;color:#ead49a}
  .lede{font-size:21px;line-height:1.5;color:#c9bec3;max-width:560px;margin:0 0 34px}
  .meta{display:flex;align-items:center;gap:18px;font-family:'IBM Plex Mono',monospace;font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:#bdb2b7;border-top:1px solid rgba(201,164,92,.28);padding-top:22px}
  .dot{width:4px;height:4px;background:#c9a45c;transform:rotate(45deg)}
  .cover{position:relative;justify-self:center;width:300px;box-shadow:0 40px 80px rgba(0,0,0,.65),0 0 0 1px rgba(201,164,92,.18)}
  .cover img{display:block;width:100%;height:auto}
  .cover::before{content:"";position:absolute;inset:-26px;background:radial-gradient(circle,rgba(125,16,48,.45),transparent 66%);filter:blur(24px);z-index:-1}
  .url{position:absolute;left:68px;bottom:38px;font-family:'IBM Plex Mono',monospace;font-size:11px;letter-spacing:.26em;text-transform:uppercase;color:#8f8388}
</style>
</head>
<body>
<div class="canvas">
  <div>
    <p class="label">Unreleased Books</p>
    <h1>The Rules <em>Behind</em> the Curtain</h1>
    <p class="lede">Books you were never supposed to find. Seven chapters on the unwritten rules of power, wealth, access and influence.</p>
    <div class="meta"><span>Elias Morgan</span><span class="dot"></span><span>Instant PDF</span><span class="dot"></span><span>DRM-free</span></div>
  </div>
  <div class="cover"><img src="../assets/cover.png" alt=""></div>
  <p class="url">unreleasedbooks.com</p>
</div>
</body>
</html>
