<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Icon</title>
<style>
  html,body{margin:0;width:512px;height:512px;overflow:hidden;background:#08060a}
  .wrap{width:512px;height:512px;display:grid;place-items:center;background:radial-gradient(circle at 50% 38%,#1c0d15,#08060a 72%)}
  .mark{position:relative;width:340px;height:340px;border:2px solid #c9a45c;display:grid;place-items:center;color:#ead49a;font-family:Georgia,'Times New Roman',serif;font-size:168px;line-height:1;letter-spacing:.01em}
  .mark::after{content:"";position:absolute;inset:16px;border:1px solid rgba(201,164,92,.35)}
  .mark span{transform:translateY(-4px)}
</style>
</head>
<body><div class="wrap"><div class="mark"><span>UB</span></div></div></body>
</html>
