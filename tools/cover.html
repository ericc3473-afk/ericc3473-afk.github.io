<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Cover — The Gilded Code</title>
<style>
  @font-face {
    font-family: 'Bodoni Moda';
    font-style: normal;
    font-weight: 400 900;
    font-display: block;
    src: url(../assets/fonts/bodoni-moda-400-900-normal-latin.woff2) format('woff2');
  }
  html, body { margin: 0; padding: 0; background: #0c0a08; }
  svg { display: block; }
  .didone { font-family: 'Bodoni Moda', Georgia, serif; }
</style>
</head>
<body>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1800" viewBox="0 0 1200 1800" role="img" aria-label="Cover of The Gilded Code by Kael Varnow">
  <defs>
    <radialGradient id="ground" cx="50%" cy="38%" r="78%">
      <stop offset="0%" stop-color="#1b1712"/>
      <stop offset="55%" stop-color="#131009"/>
      <stop offset="100%" stop-color="#0a0806"/>
    </radialGradient>

    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#8a6a2f"/>
      <stop offset="22%" stop-color="#d9bc78"/>
      <stop offset="46%" stop-color="#f0dda8"/>
      <stop offset="68%" stop-color="#c2a058"/>
      <stop offset="100%" stop-color="#7d6029"/>
    </linearGradient>

    <linearGradient id="goldV" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e8cf94"/>
      <stop offset="50%" stop-color="#c2a058"/>
      <stop offset="100%" stop-color="#8a6a2f"/>
    </linearGradient>

    <filter id="grain" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="4" stitchTiles="stitch"/>
      <feColorMatrix type="saturate" values="0"/>
    </filter>

    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="0.6"/>
    </filter>

    <!-- one engraved petal -->
    <path id="petal" d="M0 0 C 30 -54 40 -128 0 -204 C -40 -128 -30 -54 0 0 Z"/>
    <g id="petalInk">
      <use href="#petal"/>
      <path d="M0 -14 L0 -186"/>
      <path d="M0 -58 C 11 -80 16 -104 13 -128"/>
      <path d="M0 -58 C -11 -80 -16 -104 -13 -128"/>
      <path d="M0 -108 C 8 -124 11 -142 9 -160"/>
      <path d="M0 -108 C -8 -124 -11 -142 -9 -160"/>
    </g>

    <!-- a leaf sprig -->
    <g id="sprig">
      <path d="M0 0 C 22 -34 52 -66 92 -88 C 66 -50 36 -20 0 0 Z"/>
      <path d="M4 -4 C 30 -30 58 -58 86 -82"/>
      <path d="M28 -26 C 34 -42 44 -54 56 -62"/>
      <path d="M44 -40 C 52 -52 62 -60 74 -66"/>
    </g>

    <!-- corner flourish -->
    <g id="corner" fill="none" stroke="url(#gold)" stroke-width="2">
      <path d="M74 206 C 74 134 122 86 206 80"/>
      <path d="M90 206 C 90 144 132 102 206 96"/>
      <path d="M206 80 C 184 92 168 110 162 132"/>
      <path d="M162 132 C 148 120 134 122 127 134 C 120 146 125 160 139 162 C 150 164 159 155 156 144"/>
      <path d="M206 96 C 228 104 242 122 245 145"/>
      <path d="M245 145 C 259 139 271 146 273 158 C 275 170 265 179 254 176"/>
      <path d="M116 122 C 142 106 172 100 200 104" opacity="0.55"/>
      <path d="M104 104 C 122 92 142 86 160 84" opacity="0.4"/>
      <circle cx="156" cy="144" r="2.6" fill="url(#gold)" stroke="none"/>
      <circle cx="254" cy="176" r="2.2" fill="url(#gold)" stroke="none"/>
      <circle cx="74" cy="206" r="2.4" fill="url(#gold)" stroke="none"/>
      <circle cx="206" cy="80" r="2.4" fill="url(#gold)" stroke="none"/>
    </g>

    <radialGradient id="gilt" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#c8a55c" stop-opacity="0.13"/>
      <stop offset="55%" stop-color="#c8a55c" stop-opacity="0.05"/>
      <stop offset="100%" stop-color="#c8a55c" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- ground -->
  <rect width="1200" height="1800" fill="url(#ground)"/>
  <rect width="1200" height="1800" filter="url(#grain)" opacity="0.10" style="mix-blend-mode:overlay"/>
  <rect width="1200" height="1800" fill="url(#ground)" opacity="0.18"/>

  <!-- frame -->
  <rect x="46" y="46" width="1108" height="1708" fill="none" stroke="url(#gold)" stroke-width="1.1" opacity="0.55"/>
  <rect x="64" y="64" width="1072" height="1672" fill="none" stroke="url(#gold)" stroke-width="2.1"/>
  <rect x="78" y="78" width="1044" height="1644" fill="none" stroke="url(#gold)" stroke-width="0.8" opacity="0.5"/>

  <use href="#corner" transform="translate(0,0)"/>
  <use href="#corner" transform="translate(1200,0) scale(-1,1)"/>
  <use href="#corner" transform="translate(0,1800) scale(1,-1)"/>
  <use href="#corner" transform="translate(1200,1800) scale(-1,-1)"/>

  <!-- top rule + lozenge -->
  <g stroke="url(#gold)" fill="none" stroke-width="1.2" opacity="0.9">
    <path d="M430 168 H556"/>
    <path d="M644 168 H770"/>
    <path d="M600 152 L616 168 L600 184 L584 168 Z"/>
    <circle cx="600" cy="168" r="2.6" fill="url(#gold)" stroke="none"/>
  </g>

  <!-- title -->
  <g class="didone" text-anchor="middle" fill="#f4ecdd">
    <text x="600" y="352" font-size="84" letter-spacing="34" font-weight="500">THE</text>
    <text x="600" y="524" font-size="168" letter-spacing="10" font-weight="500">GILDED</text>
    <text x="600" y="690" font-size="168" letter-spacing="10" font-weight="500">CODE</text>
  </g>

  <g class="didone" text-anchor="middle">
    <text x="600" y="778" font-size="30" letter-spacing="12" fill="#c8a55c" font-weight="500">ABUNDANCE BY DESIGN</text>
  </g>

  <!-- ornament -->
  <circle cx="600" cy="1120" r="340" fill="url(#gilt)"/>
  <g transform="translate(600 1120)" fill="none" stroke="url(#gold)">
    <!-- outer sprigs -->
    <g stroke-width="1.9" opacity="0.95">
      <use href="#sprig" transform="rotate(-118) translate(0 -58) scale(0.95)"/>
      <use href="#sprig" transform="rotate(-62) translate(0 -58) scale(0.95)"/>
      <use href="#sprig" transform="rotate(118) translate(0 -58) scale(0.95)"/>
      <use href="#sprig" transform="rotate(62) translate(0 -58) scale(0.95)"/>
      <use href="#sprig" transform="rotate(180) translate(0 -58) scale(0.8)"/>
    </g>

    <!-- outer petal ring -->
    <g stroke-width="1.9" fill="rgba(200,165,92,0.045)">
      <use href="#petalInk" transform="rotate(0) scale(1.16)"/>
      <use href="#petalInk" transform="rotate(45) scale(1.16)"/>
      <use href="#petalInk" transform="rotate(90) scale(1.16)"/>
      <use href="#petalInk" transform="rotate(135) scale(1.16)"/>
      <use href="#petalInk" transform="rotate(180) scale(1.16)"/>
      <use href="#petalInk" transform="rotate(225) scale(1.16)"/>
      <use href="#petalInk" transform="rotate(270) scale(1.16)"/>
      <use href="#petalInk" transform="rotate(315) scale(1.16)"/>
    </g>

    <!-- inner rosette -->
    <g stroke-width="1.6" fill="rgba(200,165,92,0.07)">
      <use href="#petalInk" transform="rotate(22.5) scale(0.66)"/>
      <use href="#petalInk" transform="rotate(67.5) scale(0.66)"/>
      <use href="#petalInk" transform="rotate(112.5) scale(0.66)"/>
      <use href="#petalInk" transform="rotate(157.5) scale(0.66)"/>
      <use href="#petalInk" transform="rotate(202.5) scale(0.66)"/>
      <use href="#petalInk" transform="rotate(247.5) scale(0.66)"/>
      <use href="#petalInk" transform="rotate(292.5) scale(0.66)"/>
      <use href="#petalInk" transform="rotate(337.5) scale(0.66)"/>
    </g>

    <!-- core -->
    <g stroke-width="1.5">
      <circle cx="0" cy="0" r="40"/>
      <circle cx="0" cy="0" r="26"/>
      <circle cx="0" cy="0" r="11" fill="url(#gold)" stroke="none"/>
      <g opacity="0.85">
        <path d="M0 -40 L0 -26 M0 26 L0 40 M-40 0 L-26 0 M26 0 L40 0"/>
        <path d="M-28 -28 L-18 -18 M18 18 L28 28 M-28 28 L-18 18 M18 -18 L28 -28"/>
      </g>
    </g>

    <!-- berries -->
    <g fill="url(#gold)" stroke="none" opacity="0.9">
      <circle cx="-196" cy="86" r="7"/>
      <circle cx="-214" cy="112" r="5"/>
      <circle cx="196" cy="86" r="7"/>
      <circle cx="214" cy="112" r="5"/>
      <circle cx="-120" cy="-186" r="5.5"/>
      <circle cx="120" cy="-186" r="5.5"/>
      <circle cx="0" cy="206" r="6"/>
    </g>
  </g>

  <!-- author -->
  <g stroke="url(#gold)" fill="none" stroke-width="1.2" opacity="0.9">
    <path d="M470 1478 H730"/>
    <path d="M600 1466 L606 1478 L600 1490 L594 1478 Z" fill="url(#gold)" stroke="none"/>
  </g>
  <g class="didone" text-anchor="middle">
    <text x="600" y="1562" font-size="40" letter-spacing="16" fill="#d8c79f" font-weight="500">KAEL VARNOW</text>
  </g>

  <g stroke="url(#gold)" fill="none" stroke-width="1" opacity="0.6">
    <path d="M400 1626 H800"/>
  </g>
</svg>
</body>
</html>
